name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          #the project is written on windows, where paths and line endings differ
          - os: windows-latest
            node: 24

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run the tests
        run: npm test

      #the coverage flags are still experimental in node and may change between
      #versions, so the thresholds are enforced on one version only
      - name: Check coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run coverage
